# FR #9776 — webhooks site-kit BUILD. No jeeves.exe, no Ergo, no MSI.
machine: flamingo
baseline: last_release_tag
channel: "#bobiverse"
max_parallel_builds: 1
suites:
  - name: webhooks-sparse
    cmd: python -m pytest -q -p no:cacheprovider jeeves/tests/test_fr9776_webhooks_build_yml.py
    cwd: .
    timeout: 600
pack:
  cmd: powershell -NoProfile -File jeeves/scripts/Pack-BobWebhooksSiteKit.ps1 -RepoRoot . -OutDir {{out_dir}}
  artifacts:
    - MANIFEST.json
release:
  target: none
  tag: ""
  never_latest: true
install_test:
  machine: flamingo
  note: "site kit only; do not install ircJeeves or BobIrcd"
  products: []
