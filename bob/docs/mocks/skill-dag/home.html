<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Skill DAG resolve</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 24px; color: #1a1a1a; background: #f6f7f8; }
    h1 { font-size: 20px; }
    .card { background: #fff; border: 1px solid #d0d4d8; padding: 16px; max-width: 640px; }
    dt { font-weight: 600; margin-top: 8px; }
    dd { margin: 0 0 4px 0; }
    .ok { color: #0b6b2f; }
  </style>
</head>
<body>
  <h1>skill-dag resolve</h1>
  <div class="card">
    <dl>
      <dt>Job line</dt>
      <dd>FR SimonBarnett/bobiverse#000 worker skill index</dd>
      <dt>Returned ids</dt>
      <dd>bobiverse-bob-job-fr, bobiverse-bob-job-irc, bobiverse-worker-seat</dd>
      <dt>Edges</dt>
      <dd>bobiverse-bob-job-fr depends_on bobiverse-bob-job-irc</dd>
      <dt>Bytes</dt>
      <dd class="ok">1840 of 24000</dd>
      <dt>Skipped</dt>
      <dd>none</dd>
    </dl>
  </div>
</body>
</html>
