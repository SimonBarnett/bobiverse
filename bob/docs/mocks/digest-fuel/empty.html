<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>TipForm fuel - empty</title>
<style>
  body { font-family: Segoe UI, sans-serif; background:#111; color:#eee; margin:24px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 12px; margin:8px 0; background:#1c1c1c; border-radius:8px; }
  .logo { width:28px; height:28px; border-radius:6px; object-fit:cover; }
  .logo-fallback { width:28px; height:28px; border-radius:6px; display:none; align-items:center; justify-content:center; font-size:11px; background:#333; color:#888; }
  .pct { color:#888; }
</style>
</head>
<body>
<h1>Bob Status - fuel (empty / unknown)</h1>
<div class="row" data-family="cursor"><img class="logo" src="../../../tray/assets/fuel-logos/cursor.png" alt="Cursor" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="logo-fallback">Cu</div><div class="meta">Cursor Models</div><div class="pct">n/a</div></div>
<div class="row" data-family="xai"><img class="logo" src="../../../tray/assets/fuel-logos/xai.png" alt="xAI" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="logo-fallback">xAI</div><div class="meta">xAI weekly | account n/a</div><div class="pct">n/a</div></div>
<div class="row" data-family="opencode"><img class="logo" src="../../../tray/assets/fuel-logos/opencode.png" alt="OpenCode" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="logo-fallback">OC</div><div class="meta">OpenCode free/go</div><div class="pct">n/a</div></div>
<div class="row" data-family="copilot"><img class="logo" src="../../../tray/assets/fuel-logos/copilot.png" alt="Copilot" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="logo-fallback">Gh</div><div class="meta">GitHub Copilot</div><div class="pct">unknown</div></div>
</body>
</html>
