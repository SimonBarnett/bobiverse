<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>bob-worker .NET — starting (key)</title>
  <style>
    body { font-family: Consolas, monospace; background: #111; color: #ddd; margin: 2rem; }
    .line { margin: 0.4rem 0; }
    .spin { color: #8cf; }
    .ok { color: #8f8; }
    .dim { color: #888; }
  </style>
</head>
<body>
  <h1>Bob worker console — startup (key path)</h1>
  <p class="dim">No product web UI — wireframe of the console before agent TUI.</p>
  <div class="line">INFO crash-report=on (default)</div>
  <div class="line"><span class="spin">⠋</span> unpack shipped scripts …</div>
  <div class="line"><span class="ok">✓</span> fuel source=cache duration_ms=12</div>
  <div class="line"><span class="spin">⠙</span> IRC join #machine …</div>
  <div class="line"><span class="ok">✓</span> IRC joined — starting grok</div>
  <p class="dim">Spinner stops; agent TUI owns this window.</p>
</body>
</html>
