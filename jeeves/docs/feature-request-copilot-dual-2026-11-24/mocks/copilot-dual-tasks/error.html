<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Copilot dual tasks — error / stale</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background: #161b22; color: #e6edf3; margin: 24px; }
    .card { background: #21262d; border-radius: 8px; padding: 16px; max-width: 420px; }
    .title { font-weight: 600; margin-bottom: 8px; }
    .stale { color: #f85149; }
    .bar { height: 10px; background: #484f58; border-radius: 4px; width: 40%; margin: 6px 0 12px; }
    .muted { color: #8b949e; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Copilot</div>
    <div class="stale">Copilot — [stale] unknown</div>
    <div class="bar" title="unknown / stale bar"></div>
    <p class="muted">Pool stale; task list empty until the next successful observe/dispatch tick.</p>
  </div>
</body>
</html>
