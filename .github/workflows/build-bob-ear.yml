# Isolated bob-ear.exe build. Not a release, MSI, install, or service start.
# Build-BobEar.ps1 owns the PyInstaller command and the --help smoke check.
# FR #6727: behavior_source_sha pins the pool-monitor + bobiverse_build files to
# 523450ec4fbb3436f71568d65aa7a4e10fb36861 (OpenCode fuel ProcessStartInfo + BOBIVERSE_PYTHON).
# History: 0db71bfa / FR #6722; 44ea47d3 / FR #6672; FR #6558 merge
# 2da1eb06d0c99cd3384d6bf1bb21faa830526ba5 / PR #6575.
name: build-bob-ear

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-bob-ear.yml
      - bob/docs/deploy-pool-monitor-manifest.txt

permissions:
  contents: read

jobs:
  build-bob-ear:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and the ear Python dependency
        run: |
          python -m pip install --upgrade pip pyinstaller
          . .\common\scripts\Bobiverse-Common.ps1
          Install-BobiversePythonDeps -Python (Get-Command python).Source

      - name: Confirm behavior files match 523450ec (FR #6851 / #6745)
        env:
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:WORKFLOW_COMMIT) { throw "checkout $head is not $env:WORKFLOW_COMMIT" }
          $expected = "523450ec4fbb3436f71568d65aa7a4e10fb36861"
          git fetch --no-tags --depth=1 origin $expected
          git diff --exit-code $expected -- `
            common/scripts/bobreport.py `
            common/scripts/irc_agent.py `
            common/scripts/opencode_fuel.py `
            common/scripts/bobiverse_build.py `
            bob/tray/src/Public/Get-BobTrayHover.ps1 `
            bob/tray/src/Private/Get-BobIrc.ps1 `
            bob/tray/tools/Watch-BobTray.ps1 `
            bob/tray/tools/Get-BobOpencodeFuel.ps1 `
            bob/tray/src/BobBridge.psm1

      - name: Build with Build-BobEar.ps1
        env:
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $root = (Get-Location).Path
          $out = Join-Path $env:RUNNER_TEMP "bob-ear-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $py = (Get-Command python).Source
          & "$root\bob\scripts\Build-BobEar.ps1" -RepoRoot $root -OutDir $out -Python $py
          if ($LASTEXITCODE -ne 0) { throw "Build-BobEar.ps1 exit $LASTEXITCODE" }
          $exe = Join-Path $out "ear-build\dist\bob-ear.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Build-BobEar.ps1 did not leave bob-ear.exe" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          $stage = Join-Path $env:RUNNER_TEMP "bob-ear-artifact"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $stage "bob-ear.exe")
          Copy-Item -LiteralPath "$root\bob\docs\deploy-pool-monitor-manifest.txt" -Destination (Join-Path $stage "deploy-pool-monitor-manifest.txt")
          @(
            "behavior_source_sha=523450ec4fbb3436f71568d65aa7a4e10fb36861"
            "workflow_commit=$($env:WORKFLOW_COMMIT)"
            "exe_name=bob-ear.exe"
            "exe_sha256=$hash"
          ) | Set-Content -Encoding ascii (Join-Path $stage "provenance.txt")
          Set-Content -Encoding ascii (Join-Path $stage "bob-ear.exe.sha256") "$hash  bob-ear.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: bob-ear
          path: ${{ runner.temp }}/bob-ear-artifact
          if-no-files-found: error
