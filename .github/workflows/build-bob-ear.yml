# Isolated bob-ear.exe build. Not a release, MSI, install, or service start.
# Build-BobEar.ps1 owns the PyInstaller command and the --help smoke check.
# FR #7179 / #7202: build the checked-out commit on push to main and on PRs that
# touch ear sources (frozen irc_agent import graph + Build-BobEar pins). Provenance records that commit SHA (no hard behavior pin).
# Prior pin history (FR #7065 / #7039 / #6727 / #6722 / #6672 / #6558 merge
# 2da1eb06d0c99cd3384d6bf1bb21faa830526ba5 / PR #6575) lives in
# bob/docs/deploy-pool-monitor-manifest.txt for deploy notes only.
