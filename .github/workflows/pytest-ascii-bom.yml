# FR #3975 / #8765: BOM-less ASCII gates on every PR (not only gitclaim).
# Watched scripts (must stay BOM-less ASCII):
#   airc/scripts/Install-Airc.ps1
#   airc/scripts/Install-AircConsole.ps1
#   bob/scripts/Ensure-BobTrayRunning.ps1
#   common/scripts/intake.py
#   common/scripts/Update-BobFleet.ps1 (stale tips often reintroduce U+2014)
# Complements pytest-gitclaim.yml so comment-only Unicode cannot merge with main red (#3966).
# Writers: common/scripts/Write-BobiversePs1AsciiNoBom.ps1 + bobiverse_ps1_ascii.py
# Pre-push: Assert-BobiverseChangedPs1Ascii.ps1
# FR #9217: required status check on ruleset required-ci-3948 (with conflict-markers).
name: pytest-ascii-bom

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest-ascii-bom:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Changed *.ps1 ASCII scan (FR #8765)
        run: |
          python common/scripts/bobiverse_ps1_ascii.py check --repo (Get-Location).Path

      - name: BOM-less ASCII gates (FR #3975 / #3966 / #8765)
        run: |
          $env:PYTHONPATH = "$((Get-Location).Path)\common\scripts;$((Get-Location).Path)\jeeves;$((Get-Location).Path)\common\tests;$((Get-Location).Path)"
          python -m pytest `
            airc/tests/test_fr2499_install_airc_console_parse.py `
            airc/tests/test_fr3391_install_airc_parse.py `
            airc/tests/test_mrb2501_hostile_install_airc_parse.py `
            airc/tests/test_fr3756_install_ergo_pass_fallback.py `
            airc/tests/test_fr4380_install_ascii_emdash.py `
            jeeves/tests/test_mrb3757_hostile_fr3756.py `
            jeeves/tests/test_mrb3760_hostile_fr3759.py `
            common/tests/test_fr611_intake_error_body.py `
            common/tests/test_mrb2936_hostile_stale_pin_green.py `
            common/tests/test_mrb3569_hostile_fr3563_stale_pins.py `
            common/tests/test_fr8765_ps1_ascii_helpers.py `
            jeeves/tests/test_fr3975_ci_ascii_bom_gates.py `
            -q --tb=short

      - name: Webhook docs route coverage (FR #8835)
        run: |
          $env:PYTHONPATH = "$((Get-Location).Path)\common\scripts;$((Get-Location).Path)\jeeves;$((Get-Location).Path)\common\tests;$((Get-Location).Path)"
          python -m pytest common/tests/test_fr8835_webhook_docs_route_coverage.py -q -p no:cacheprovider --tb=short
