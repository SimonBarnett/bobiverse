# Isolated Plan-agent CI (FR #7524 / FR #7276 per-component).
# Not a release, MSI, or seat restart. Pytest + PSScriptAnalyzer + SKILL front matter,
# then a versioned artifact (AGENTS.md, skills, tools, docs) with MANIFEST.json for Slab.
name: build-bob-plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-bob-plan.yml
      - bob/agents/plan/**
      - bob/.grok/skills/bobiverse-bob-plan/**
      - bob/tests/test_fr7524_plan_build_ci.py
  push:
    branches: [main]
    paths:
      - .github/workflows/build-bob-plan.yml
      - bob/agents/plan/**
      - bob/.grok/skills/bobiverse-bob-plan/**
      - bob/tests/test_fr7524_plan_build_ci.py

permissions:
  contents: read

jobs:
  build-bob-plan:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip pytest
          if ($LASTEXITCODE -ne 0) { throw "pip install pytest failed: $LASTEXITCODE" }

      - name: Pytest bob/agents/plan/tests
        env:
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: ${{ github.workspace }}/bob/scripts;${{ github.workspace }}/common/scripts
        run: |
          $root = (Get-Location).Path
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:WORKFLOW_COMMIT) { throw "checkout $head is not $env:WORKFLOW_COMMIT" }
          python -m pytest "$root\bob\agents\plan\tests" "$root\bob\tests\test_fr7524_plan_build_ci.py" -q --tb=short
          if ($LASTEXITCODE -ne 0) { throw "plan pytest exit $LASTEXITCODE" }

      - name: Parse-check and PSScriptAnalyzer plan tools
        run: |
          $root = (Get-Location).Path
          $tools = Get-ChildItem -LiteralPath (Join-Path $root "bob\agents\plan\tools") -Filter *.ps1 -File -ErrorAction Stop
          if (-not $tools) { throw "no bob/agents/plan/tools/*.ps1" }
          foreach ($f in $tools) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              throw ("parse failed {0}: {1}" -f $f.Name, ($errors | ForEach-Object { $_.Message } | Select-Object -First 3) -join "; ")
            }
          }
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck -AllowClobber
          $issues = @()
          foreach ($f in $tools) {
            $issues += @(Invoke-ScriptAnalyzer -Path $f.FullName -Severity Error,Warning -ErrorAction Stop)
          }
          $blockers = @($issues | Where-Object { $_.Severity -eq "Error" })
          if ($blockers.Count -gt 0) {
            $blockers | ForEach-Object { Write-Host ("{0}:{1} {2}" -f $_.ScriptName, $_.Line, $_.Message) }
            throw ("PSScriptAnalyzer errors: {0}" -f $blockers.Count)
          }
          if ($issues.Count -gt 0) {
            Write-Host ("PSScriptAnalyzer warnings: {0} (non-blocking)" -f $issues.Count)
            $issues | Select-Object -First 20 | ForEach-Object { Write-Host ("{0}:{1} {2}" -f $_.ScriptName, $_.Line, $_.Message) }
          }

      - name: Validate SKILL.md front matter
        run: |
          $root = (Get-Location).Path
          $skills = @()
          $skills += Get-ChildItem -LiteralPath (Join-Path $root "bob\agents\plan\.grok\skills") -Filter SKILL.md -Recurse -File -ErrorAction SilentlyContinue
          $book = Join-Path $root "bob\.grok\skills\bobiverse-bob-plan\SKILL.md"
          if (Test-Path -LiteralPath $book) { $skills += Get-Item -LiteralPath $book }
          if (-not $skills) { throw "no plan SKILL.md files found" }
          foreach ($f in $skills) {
            $raw = Get-Content -LiteralPath $f.FullName -Raw -Encoding UTF8
            if (-not $raw.TrimStart().StartsWith("---")) {
              throw ("missing YAML front matter: {0}" -f $f.FullName.Substring($root.Length).TrimStart("\"))
            }
          }
          Write-Host ("validated {0} SKILL.md file(s)" -f $skills.Count)

      - name: Stage plan-agent artifact with MANIFEST.json
        env:
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $root = (Get-Location).Path
          $commit = $env:WORKFLOW_COMMIT
          $stage = Join-Path $env:RUNNER_TEMP "bob-plan-artifact"
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $src = Join-Path $root "bob\agents\plan"
          foreach ($name in @("AGENTS.md", "docs", "tools", ".grok")) {
            $from = Join-Path $src $name
            if (-not (Test-Path -LiteralPath $from)) { throw "missing plan source $name" }
            $to = Join-Path $stage $name
            if (Test-Path -LiteralPath $from -PathType Container) {
              Copy-Item -LiteralPath $from -Destination $to -Recurse -Force
            } else {
              Copy-Item -LiteralPath $from -Destination $to -Force
            }
          }
          $bookSrc = Join-Path $root "bob\.grok\skills\bobiverse-bob-plan"
          if (Test-Path -LiteralPath $bookSrc) {
            $bookDst = Join-Path $stage "skills\bobiverse-bob-plan"
            New-Item -ItemType Directory -Force -Path (Split-Path $bookDst) | Out-Null
            Copy-Item -LiteralPath $bookSrc -Destination $bookDst -Recurse -Force
          }
          $files = [ordered]@{}
          Get-ChildItem -LiteralPath $stage -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($stage.Length).TrimStart("\").Replace("\", "/")
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            $files[$rel] = @{
              sha256 = $hash
              size_bytes = $_.Length
            }
          }
          $manifest = [ordered]@{
            source_commit = $commit
            workflow_commit = $commit
            build_time_utc = [DateTime]::UtcNow.ToString("o")
            fr = "7524"
            component = "bob-plan"
            files = $files
          }
          $manPath = Join-Path $stage "MANIFEST.json"
          ($manifest | ConvertTo-Json -Depth 6) | Set-Content -Encoding utf8 -LiteralPath $manPath
          @(
            "source_commit=$commit"
            "workflow_commit=$commit"
            "component=bob-plan"
            "fr=7524"
            "build_time_utc=$($manifest.build_time_utc)"
            "file_count=$($files.Count)"
          ) | Set-Content -Encoding ascii (Join-Path $stage "provenance.txt")
          if (-not (Test-Path -LiteralPath $manPath)) { throw "missing MANIFEST.json" }
          if ($files.Count -lt 3) { throw "artifact too small: $($files.Count) files" }
          Write-Host ("staged {0} files for bob-plan artifact" -f $files.Count)

      - uses: actions/upload-artifact@v4
        with:
          name: bob-plan
          path: ${{ runner.temp }}/bob-plan-artifact
          if-no-files-found: error
