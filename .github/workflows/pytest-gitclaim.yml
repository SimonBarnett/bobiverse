# FR #1454: keep resync pagination (and related gitclaim) regressions out of main.
# FR #2540: BOB_DIGEST_HOME must not leak across GET /report â†’ later queue_path (fair-isol canary).
# Runs when gitclaim or its resync-pagination tests change.
name: pytest-gitclaim

on:
  pull_request:
    paths:
      - "common/scripts/gitclaim.py"
      - "common/scripts/bobreport.py"
      - "jeeves/tests/test_fr1150_resync_paginate.py"
      - "jeeves/tests/test_fr1093_require_machine_stale_rows.py"
      - "jeeves/tests/test_mrb1174_focus_needs_mrb1_offer.py"
      - "jeeves/tests/test_fr2540_digest_home_no_leak.py"
      - "common/tests/**"
      - "jeeves/tests/**"
      - "pytest.ini"
      - "conftest.py"
      - ".github/workflows/pytest-gitclaim.yml"
  push:
    branches: [main]
    paths:
      - "common/scripts/gitclaim.py"
      - "common/scripts/bobreport.py"
      - "jeeves/tests/test_fr1150_resync_paginate.py"
      - "jeeves/tests/test_fr2540_digest_home_no_leak.py"
      - ".github/workflows/pytest-gitclaim.yml"

jobs:
  pytest-gitclaim:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Resync pagination gate (FR #1150 / #1454)
        run: |
          $env:PYTHONPATH = "$((Get-Location).Path)\common\scripts;$((Get-Location).Path)\jeeves"
          python -m pytest `
            jeeves/tests/test_fr1454_ci_gitclaim_gate.py `
            jeeves/tests/test_fr1150_resync_paginate.py `
            -q --tb=short

      - name: Broader gitclaim / chair offer suite
        run: |
          $env:PYTHONPATH = "$((Get-Location).Path)\common\scripts;$((Get-Location).Path)\jeeves"
          python -m pytest `
            jeeves/tests/test_fr1093_require_machine_stale_rows.py `
            jeeves/tests/test_mrb1174_focus_needs_mrb1_offer.py `
            jeeves/tests/test_fr1323_mrb_done_no_reoffer.py `
            -q --tb=short

      - name: Fair-isol digest-home leak canary (FR #2540)
        run: |
          # Tip regression vs 82346a1: github_pr_exists_checker setdefault(BOB_DIGEST_HOME)
          # during GET /bob/v1/report redirected later queue_path/offer checks.
          Remove-Item Env:BOB_* -ErrorAction SilentlyContinue
          Remove-Item Env:JEEVES_* -ErrorAction SilentlyContinue
          $env:PYTHONPATH = "$((Get-Location).Path)\common\scripts;$((Get-Location).Path)\jeeves"
          python -m pytest `
            jeeves/tests/test_fr2540_digest_home_no_leak.py `
            jeeves/tests/test_webhooks_no_secret.py::test_get_digest_still_public `
            jeeves/tests/test_fr1993_jeeves_exe_wp2.py::test_fr1993_wp2_self_test_queue_and_offer `
            jeeves/tests/test_fr1993_jeeves_exe_wp2.py::test_fr1993_wp2_summarize_empty_offer `
            -q --tb=short

      - name: Previously-red jeeves acceptance pins (FR #2633)
        run: |
          $env:PYTHONPATH = "$((Get-Location).Path)\jeeves\scripts;$((Get-Location).Path)\jeeves\tests;$((Get-Location).Path)\jeeves\tools;$((Get-Location).Path)\common\scripts;$((Get-Location).Path)\common\tests;$((Get-Location).Path)\bob\scripts;$((Get-Location).Path)\airc\scripts"
          python -m pytest `
            jeeves/tests/test_ergo_host_020.py::test_start_bob_passes_host_explicitly_and_validates_it `
            jeeves/tests/test_fr1508_ungated_offer_holds.py::test_clear_orphan_digest_mrb_doing `
            jeeves/tests/test_fr1518_ungated_offerable_monitor.py::test_fr1518_gated_skill_and_pins_exit0_with_counts `
            jeeves/tests/test_fr1927_mrb_enqueue_when_resync_blocked.py `
            jeeves/tests/test_fr1_msi_fleet_acceptance.py `
            jeeves/tests/test_harvest1581_chair_assign_myth.py `
            jeeves/tests/test_harvest1613_mrb_done_open_pr.py `
            jeeves/tests/test_harvest1715_nak_busy_workers_map.py `
            jeeves/tests/test_jeeves_self_contained.py::test_no_agentic_irc_repo_or_module_dependency `
            jeeves/tests/test_mrb1337_offer_top_is_pull.py::test_assign_row_refuses_fr_that_is_pull `
            jeeves/tests/test_mrb2267_hostile_jeeves_exe_foundation.py::test_mrb2267_living_fr_refs_not_closes_in_docs `
            jeeves/tests/test_mrb2319_body_truncate_hostile.py::test_mrb2319_blank_line_before_trailing_pin `
            jeeves/tests/test_mrb2468_hostile_release_ionos_cues.py::test_hostile_marchhare_blocked_when_pinned_ionos `
            jeeves/tests/test_mrb2482_hostile_fomprep_umbrella_skip.py::test_mrb2482_pin_set_exact_five `
            jeeves/tests/test_mrb807_fix_monitor_queue_shapes.py::test_queue_flow_mrb_missing_pull_url_uses_task_field `
            -q --tb=line
