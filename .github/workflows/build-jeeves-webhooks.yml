# FR #7465 / #7517: site kit for the IIS www bundle. Not a service executable build and not a service restart.
name: build-jeeves-webhooks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-jeeves-webhooks.yml
      - jeeves/www/**
      - jeeves/assets/**
      - bob/tray/assets/ntsa-gut-logo.png
      - bob/tray/assets/bob-systray.ico
      - jeeves/scripts/Install-BobWebhooks.ps1
      - jeeves/scripts/jeeves_webhooks_ci.py
      - jeeves/tests/test_fr7465_webhooks_ci.py
      - jeeves/tests/test_fr7460_webconfig_staticcontent.py
      - jeeves/tests/test_fr7517_webhooks_kit_assets.py
      - jeeves/tests/test_fr8887_webroot_backups.py
      - jeeves/tests/test_fr9774_webhooks_sparse_ci.py
      - jeeves/scripts/Stamp-PriorityAgentDownloads.ps1
      - jeeves/scripts/Install-Jeeves.ps1
  push:
    branches: [main]
    paths:
      - .github/workflows/build-jeeves-webhooks.yml
      - jeeves/www/**
      - jeeves/assets/**
      - bob/tray/assets/ntsa-gut-logo.png
      - bob/tray/assets/bob-systray.ico
      - jeeves/scripts/Install-BobWebhooks.ps1
      - jeeves/scripts/jeeves_webhooks_ci.py
      - jeeves/tests/test_fr7465_webhooks_ci.py
      - jeeves/tests/test_fr7460_webconfig_staticcontent.py
      - jeeves/tests/test_fr7517_webhooks_kit_assets.py
      - jeeves/tests/test_fr8887_webroot_backups.py
      - jeeves/tests/test_fr9774_webhooks_sparse_ci.py
      - jeeves/scripts/Stamp-PriorityAgentDownloads.ps1
      - jeeves/scripts/Install-Jeeves.ps1

permissions:
  contents: read

jobs:
  build-jeeves-webhooks:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          # FR #9774: site-kit roots only. Do not list jeeves/** (chair, IRCD, monitor).
          sparse-checkout: |
            jeeves/www
            jeeves/assets
            jeeves/scripts/Install-BobWebhooks.ps1
            jeeves/scripts/jeeves_webhooks_ci.py
            jeeves/scripts/Stamp-PriorityAgentDownloads.ps1
            jeeves/scripts/Install-Jeeves.ps1
            jeeves/tests/conftest.py
            jeeves/tests/test_fr7517_webhooks_kit_assets.py
            jeeves/tests/test_fr8887_webroot_backups.py
            bob/tray/assets/ntsa-gut-logo.png
            bob/tray/assets/bob-systray.ico
            common/scripts
            common/tests
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pytest kit asset gates (FR #7517)
        run: |
          python -m pip install -q pytest
          $env:PYTHONPATH = "jeeves/scripts;common/scripts;common/tests"
          python -m pytest -q -p no:cacheprovider jeeves/tests/test_fr7517_webhooks_kit_assets.py jeeves/tests/test_fr8887_webroot_backups.py
          if ($LASTEXITCODE -ne 0) { throw "pytest exit $LASTEXITCODE" }

      - name: Check site kit and write the versioned artifact
        env:
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $root = (Get-Location).Path
          $out = Join-Path $env:RUNNER_TEMP "jeeves-webhooks-artifact"
          $published = Join-Path $env:RUNNER_TEMP "jeeves-webhooks-published"
          python "$root\jeeves\scripts\jeeves_webhooks_ci.py" --repo-root $root --physical $published --out $out --commit $env:WORKFLOW_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "jeeves_webhooks_ci.py exit $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $out "MANIFEST.json"))) { throw "missing MANIFEST.json" }

      - uses: actions/upload-artifact@v4
        with:
          name: jeeves-webhooks
          path: ${{ runner.temp }}/jeeves-webhooks-artifact
          if-no-files-found: error
