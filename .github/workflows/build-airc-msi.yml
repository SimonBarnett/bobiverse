# FR #7426: isolated airc MSI build.
# Not a GitHub Release. Sibling FRs own bob/jeeves MSIs (#7424 / #7425).
# Reuses Pack-BobiverseRelease.ps1 -Product airc + Fetch-Wix.ps1 (no WiX source fork).
# FR #4216: airc MSI embeds config/ergo.password from repo secret AIRC_PACK_ERGO_PASSWORD
# (fail closed if missing; value never printed; not written into MANIFEST.json).
name: build-airc-msi

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-airc-msi.yml
      - airc/**
      - common/scripts/Pack-BobiverseRelease.ps1
      - common/scripts/Fetch-Wix.ps1
      - common/scripts/Bobiverse-Common.ps1
      - airc/scripts/Build-Airc.ps1
      - airc/tests/test_fr7426_airc_msi_ci.py
      - src/VERSION
      - common/VERSION
  push:
    branches: [main]
    paths:
      - .github/workflows/build-airc-msi.yml
      - airc/**
      - common/scripts/Pack-BobiverseRelease.ps1
      - common/scripts/Fetch-Wix.ps1
      - common/scripts/Bobiverse-Common.ps1
      - airc/scripts/Build-Airc.ps1
      - airc/tests/test_fr7426_airc_msi_ci.py
      - src/VERSION
      - common/VERSION

permissions:
  contents: read

jobs:
  build-airc-msi:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and Bob Python deps
        run: |
          python -m pip install --upgrade pip pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "pip install pyinstaller failed: $LASTEXITCODE" }
          . .\common\scripts\Bobiverse-Common.ps1
          Install-BobiversePythonDeps -Python (Get-Command python).Source

      - name: Pack airc MSI only (same-commit exes)
        env:
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # FR #4216 / #7426: Pack reads AIRC_PACK_ERGO_PASSWORD (value never echoed).
          AIRC_PACK_ERGO_PASSWORD: ${{ secrets.AIRC_PACK_ERGO_PASSWORD }}
          # FR #6423 / #6949: Pack-BobiverseRelease downgrade gate calls gh release list.
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:WORKFLOW_COMMIT) { throw "checkout $head is not $env:WORKFLOW_COMMIT" }

          # FR #4216 / #7426: airc MSI requires Ergo PASS. Do not print the value.
          # PR without secret: soft-skip (workflow YAML still validated by pytest); push/main
          # and workflow_dispatch stay fail-closed until Si sets AIRC_PACK_ERGO_PASSWORD (#7438).
          $artifact = Join-Path $env:RUNNER_TEMP "airc-msi-artifact"
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          if (-not $env:AIRC_PACK_ERGO_PASSWORD -or -not $env:AIRC_PACK_ERGO_PASSWORD.Trim()) {
            $evt = [string]$env:GITHUB_EVENT_NAME
            if ($evt -eq 'pull_request') {
              Write-Host "WARN FR #7426 soft-skip: AIRC_PACK_ERGO_PASSWORD missing on pull_request (ops: set repo secret; see #7438)"
              $skip = [ordered]@{
                skipped         = $true
                reason          = "AIRC_PACK_ERGO_PASSWORD missing"
                event_name      = $evt
                source_commit   = $env:WORKFLOW_COMMIT
                fr              = "7426"
                ops_issue       = 7438
              }
              ($skip | ConvertTo-Json -Depth 4) | Set-Content -Encoding utf8 (Join-Path $artifact "SKIP.json")
              exit 0
            }
            throw "FR #7426 fail-closed: repo secret AIRC_PACK_ERGO_PASSWORD is missing or empty (airc MSI embeds config/ergo.password)"
          }
          Write-Host ("INFO FR #7426 Ergo PASS present (len={0}; value not printed)" -f $env:AIRC_PACK_ERGO_PASSWORD.Length)

          . "$root\common\scripts\Bobiverse-Common.ps1"

          # Three-part MSI ProductVersion that rises per CI run and stays >= latest
          # published release (FR #4389 / #6423; MSI build field max 65535).
          $latest = Get-BobiverseLatestPublishedVersion -Repo 'SimonBarnett/bobiverse'
          if (-not $latest) { throw "FR #7426 cannot resolve latest published version for CI bump" }
          $lv = [version]$latest
          $run = [int]$env:GITHUB_RUN_NUMBER
          if ($run -lt 1) { $run = 1 }
          $build = [int]$lv.Build + $run
          if ($build -gt 65535) { $build = 65535 }
          $msiVersion = "{0}.{1}.{2}" -f $lv.Major, $lv.Minor, $build
          $msiVersion = ConvertTo-BobiverseMsiProductVersion -Version $msiVersion
          Write-Host "INFO FR #7426 CI MSI version=$msiVersion (latestPublished=$latest run=$($env:GITHUB_RUN_NUMBER))"

          $out = Join-Path $env:RUNNER_TEMP "airc-msi-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          & "$root\common\scripts\Pack-BobiverseRelease.ps1" `
            -Product airc `
            -RepoRoot $root `
            -OutDir $out `
            -Version $msiVersion `
            -KeepStage
          if ($LASTEXITCODE -ne 0) { throw "Pack-BobiverseRelease.ps1 exit $LASTEXITCODE" }

          $msi = Get-ChildItem -LiteralPath $out -Filter "airc-*.msi" -File | Select-Object -First 1
          if (-not $msi) { throw "no airc-*.msi under $out" }
          $others = @(Get-ChildItem -LiteralPath $out -Filter "*.msi" -File | Where-Object { $_.Name -notmatch '^airc-' })
          if ($others.Count -gt 0) {
            throw ("unexpected non-airc MSI(s): {0}" -f (($others | ForEach-Object Name) -join ', '))
          }

          $msiHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi.FullName).Hash.ToLowerInvariant()
          $stage = Get-ChildItem -LiteralPath $out -Directory | Where-Object { $_.Name -like "airc-*" } | Select-Object -First 1
          if (-not $stage) { throw "KeepStage expected airc-* stage under $out" }

          # Confirm password file exists in stage but never read/print its contents into logs/MANIFEST.
          $stageErgo = Join-Path $stage.FullName "config\ergo.password"
          if (-not (Test-Path -LiteralPath $stageErgo)) {
            throw "airc stage missing config/ergo.password (FR #4216)"
          }

          $embedded = [ordered]@{}
          Get-ChildItem -LiteralPath $stage.FullName -Recurse -Filter "*.exe" -File | ForEach-Object {
            $rel = $_.FullName.Substring($stage.FullName.Length).TrimStart('\', '/').Replace('\', '/')
            $embedded[$rel] = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
          }
          if ($embedded.Count -lt 1) { throw "no embedded exes hashed under stage" }
          $hit = @($embedded.Keys | Where-Object { $_ -like "*airc.exe" -and $_ -notlike "*network-installer*" })
          if ($hit.Count -lt 1) { throw "missing embedded airc.exe in stage" }

          # $artifact directory created above (before secret check).
          Copy-Item -LiteralPath $msi.FullName -Destination (Join-Path $artifact $msi.Name) -Force
          $shaSide = $msi.FullName + ".sha256"
          if (Test-Path -LiteralPath $shaSide) {
            Copy-Item -LiteralPath $shaSide -Destination (Join-Path $artifact ($msi.Name + ".sha256")) -Force
          } else {
            Set-Content -Encoding ascii (Join-Path $artifact ($msi.Name + ".sha256")) "$msiHash  $($msi.Name)"
          }

          $builtAt = [DateTime]::UtcNow.ToString("o")
          $manifest = [ordered]@{
            source_commit   = $env:WORKFLOW_COMMIT
            workflow_commit = $env:WORKFLOW_COMMIT
            product         = "airc"
            msi_name        = $msi.Name
            msi_version     = $msiVersion
            msi_sha256      = $msiHash
            msi_size_bytes  = $msi.Length
            embedded        = $embedded
            ergo_password_embedded = $true
            build_time_utc  = $builtAt
            workflow_run_id = [string]$env:GITHUB_RUN_ID
            builder         = "Pack-BobiverseRelease.ps1 -Product airc"
            fr              = "7426"
          }
          $manifestJson = ($manifest | ConvertTo-Json -Depth 6)
          # Belt: never ship the secret string into the artifact MANIFEST.
          if ($manifestJson -and $env:AIRC_PACK_ERGO_PASSWORD -and $manifestJson.Contains($env:AIRC_PACK_ERGO_PASSWORD)) {
            throw "FR #7426 refuse: MANIFEST would contain Ergo PASS"
          }
          Set-Content -Encoding utf8 (Join-Path $artifact "MANIFEST.json") $manifestJson

      - uses: actions/upload-artifact@v4
        with:
          name: airc-msi
          path: ${{ runner.temp }}/airc-msi-artifact
          if-no-files-found: error
