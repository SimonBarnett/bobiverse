# Isolated bob-tray / bob-status / bob-about build (FR #6285).
# Not a release, MSI, install, or tray restart. Build-BobDialogs.ps1 owns csc.exe.
# Uploads SHA-256 provenance so Slab can hotpatch MarchHare from a known artifact.
name: build-bob-tray

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-bob-tray.yml
      - bob/tray/**
      - bob/scripts/Build-BobDialogs.ps1
      - bob/scripts/Write-BobTrayDeployedIdentity.ps1
      - bob/scripts/bob_tray_version.py
      - bob/tests/test_fr6285_tray_build_ci.py
      - bob/tests/test_fr6924_tray_version_label.py
      - bob/scripts/Stage-BobTrayHotpatchArtifact.ps1
      - bob/scripts/Install-BobTrayHotpatch.ps1
      - bob/tests/test_fr7248_tray_ci_ships_display_scripts.py
  push:
    branches: [main]
    paths:
      - .github/workflows/build-bob-tray.yml
      - bob/tray/**
      - bob/scripts/Build-BobDialogs.ps1
      - bob/scripts/Write-BobTrayDeployedIdentity.ps1
      - bob/scripts/bob_tray_version.py
      - bob/tests/test_fr6285_tray_build_ci.py
      - bob/tests/test_fr6924_tray_version_label.py
      - bob/scripts/Stage-BobTrayHotpatchArtifact.ps1
      - bob/scripts/Install-BobTrayHotpatch.ps1
      - bob/tests/test_fr7248_tray_ci_ships_display_scripts.py

permissions:
  contents: read

jobs:
  build-bob-tray:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build tray dialogs with Build-BobDialogs.ps1
        env:
          WORKFLOW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $root = (Get-Location).Path
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:WORKFLOW_COMMIT) { throw "checkout $head is not $env:WORKFLOW_COMMIT" }
          $out = Join-Path $env:RUNNER_TEMP "bob-tray-out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & "$root\bob\scripts\Build-BobDialogs.ps1" -RepoRoot $root -OutDir $out
          if ($LASTEXITCODE -ne 0) { throw "Build-BobDialogs.ps1 exit $LASTEXITCODE" }
          foreach ($name in @("bob-tray.exe", "bob-status.exe", "bob-about.exe")) {
            $exe = Join-Path $out $name
            if (-not (Test-Path -LiteralPath $exe)) { throw "missing $name" }
          }
          # FR #6285: compiled Status/TipForm heading must be "xAI weekly" (UTF-16LE in PE).
          $tray = Join-Path $out "bob-tray.exe"
          $bytes = [System.IO.File]::ReadAllBytes($tray)
          $needle = [System.Text.Encoding]::Unicode.GetBytes("xAI weekly")
          $bad = [System.Text.Encoding]::Unicode.GetBytes("Cursor / xAI weekly")
          function Find-Bytes([byte[]]$hay, [byte[]]$need) {
            for ($i = 0; $i -le $hay.Length - $need.Length; $i++) {
              $ok = $true
              for ($j = 0; $j -lt $need.Length; $j++) {
                if ($hay[$i + $j] -ne $need[$j]) { $ok = $false; break }
              }
              if ($ok) { return $true }
            }
            return $false
          }
          if (-not (Find-Bytes $bytes $needle)) {
            throw "bob-tray.exe missing UTF-16LE heading 'xAI weekly' (FR #6285)"
          }
          if (Find-Bytes $bytes $bad) {
            throw "bob-tray.exe still embeds stale heading 'Cursor / xAI weekly' (FR #6285)"
          }
          $stage = Join-Path $env:RUNNER_TEMP "bob-tray-artifact"
          # FR #7248: exes + tray display scripts (src/tools/assets) with per-file SHA-256 in MANIFEST.
          & "$root\bob\scripts\Stage-BobTrayHotpatchArtifact.ps1" -RepoRoot $root -StageDir $stage -ExeDir $out -Commit $env:WORKFLOW_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Stage-BobTrayHotpatchArtifact exit $LASTEXITCODE" }
          $hover = Join-Path $stage "src\Public\Get-BobTrayHover.ps1"
          if (-not (Test-Path -LiteralPath $hover)) { throw "artifact missing Get-BobTrayHover.ps1" }
          $watch = Join-Path $stage "tools\Watch-BobTray.ps1"
          if (-not (Test-Path -LiteralPath $watch)) { throw "artifact missing Watch-BobTray.ps1" }
          $provPath = Join-Path $stage "provenance.txt"
          if (-not (Test-Path -LiteralPath $provPath)) { throw "missing provenance.txt" }
          foreach ($name in @("bob-tray.exe", "bob-status.exe", "bob-about.exe")) {
            $exe = Join-Path $stage $name
            if (-not (Test-Path -LiteralPath $exe)) { throw "missing $name in artifact" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
            Set-Content -Encoding ascii (Join-Path $stage "$name.sha256") "$hash  $name"
          }
          $manPath = Join-Path $stage "MANIFEST.json"
          if (-not (Test-Path -LiteralPath $manPath)) { throw "missing MANIFEST.json" }
          $man = Get-Content -LiteralPath $manPath -Raw | ConvertFrom-Json
          $files = $man.files
          if (-not $files) { throw "MANIFEST.json missing files hashes (FR #7248)" }
          $hoverKey = "src/Public/Get-BobTrayHover.ps1"
          if (-not $files.$hoverKey) { throw "MANIFEST.json missing $hoverKey" }

      - uses: actions/upload-artifact@v4
        with:
          name: bob-tray
          path: ${{ runner.temp }}/bob-tray-artifact
          if-no-files-found: error
